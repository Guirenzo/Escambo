# Escambo — stack completa: MySQL 8 + API (Node) + Web (nginx servindo o build do Vite).
#
#   docker compose up -d --build     # sobe tudo  →  http://localhost:8090
#   docker compose up -d db          # só o banco (dev: API e Web rodam local com `npm run dev`)
#   docker compose logs -f api       # logs da API
#   docker compose down              # para tudo (mantém os dados)
#   docker compose down -v           # para e apaga o banco (recarrega schema + seed na próxima subida)
#
# Ordem de subida: db (healthy) → migrate (job: aplica migrations pendentes e sai) → api (healthy) → web.
# Variáveis opcionais (.env na raiz ou no shell): DB_PORT, API_PORT, WEB_PORT, JWT_SECRET, DB_*, CORS_ORIGINS.
# Produção (imagens do GHCR + Caddy com HTTPS): docker-compose.prod.yml e DEPLOY.md.

name: escambo

x-api-image: &api-image escambo-api:local

services:
  db:
    image: mysql:8.0
    container_name: escambo-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-escambo_root}
      MYSQL_DATABASE: ${DB_NAME:-escambo}
      MYSQL_USER: ${DB_USER:-escambo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-escambo}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - escambo_db_data:/var/lib/mysql
      # Só rodam com o volume vazio (primeira subida): baseline do schema + dados de referência.
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./apps/api/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${DB_ROOT_PASSWORD:-escambo_root}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Job de migrations: aplica `apps/api/db/migrations` pendentes (idempotente) e termina.
  # A API só sobe depois que este job conclui com sucesso — nunca serve com schema defasado.
  migrate:
    image: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    container_name: escambo-migrate
    restart: 'no'
    command: ['node', 'dist/scripts/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-escambo}
      DB_PASSWORD: ${DB_PASSWORD:-escambo}
      DB_NAME: ${DB_NAME:-escambo}
      JWT_SECRET: ${JWT_SECRET:-troque-isto-em-producao-com-no-minimo-32-caracteres}
      # O web (nginx) fica exatamente 1 salto na frente da API: confia no X-Forwarded-For dele,
      # para que rate limit e logs usem o IP real do usuário, não o do container do nginx.
      TRUST_PROXY: '1'
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Quem vira admin (painel /admin, mediação). Padrão só para a demo — troque em produção.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@escambo.demo}
      # Pagamentos: gateway simulado (demo). Em produção: PAYMENTS_SIMULATE=false e o segredo do webhook.
      PAYMENTS_SIMULATE: ${PAYMENTS_SIMULATE:-true}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # Cópias de dados (LGPD): arquivos ficam no volume api_data por EXPORT_TTL_DAYS dias.
      DATA_DIR: /repo/apps/api/data
      EXPORT_TTL_DAYS: ${EXPORT_TTL_DAYS:-7}
      # Anexos do chat (imagem, PDF, ZIP) no mesmo volume; limite por arquivo em MB (o nginx aceita até 25).
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      # E-mails: 'simulated' guarda na caixa de saída (painel admin); 'smtp' envia de verdade (SMTP_*).
      APP_URL: ${APP_URL:-http://localhost:8090}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-simulated}
      MAIL_FROM: ${MAIL_FROM:-Escambo <nao-responda@escambo.demo>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Avisos push no navegador (ADR 52): na demo o par VAPID é gerado na subida.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-simulated}
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:nao-responda@escambo.demo}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
      ATTACHMENT_PURGE_HOUR: ${ATTACHMENT_PURGE_HOUR:-4}
      # Rate limit por IP (padrões de produção). Para e2e/carga local, suba: LOGIN_RATE_LIMIT_MAX=1000
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      # Observabilidade (ADR 59): /metrics na porta 9464, só na rede interna (o Prometheus do perfil
      # `monitoring` lê); erros no Sentry quando SENTRY_DSN tem valor.
      METRICS_PORT: 9464
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-demo}

  api:
    image: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    container_name: escambo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api-env
    volumes:
      - api_data:/repo/apps/api/data
    ports:
      - '${API_PORT:-3333}:3333'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    container_name: escambo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8090}:8080'

  # Dados de demonstração (opcional):  docker compose run --rm demo-seed
  # Popula a instância pela API com contas, serviços, contratações, chat, boost e trocas.
  demo-seed:
    image: node:22-alpine
    container_name: escambo-demo-seed
    profiles: [demo]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3333/api
    volumes:
      - ./scripts/demo-seed.mjs:/demo-seed.mjs:ro
    command: ['node', '/demo-seed.mjs']

  # --- Monitoramento (ADR 59), opcional:  docker compose --profile monitoring up -d ---
  # A mesma configuração da produção (deploy/monitoring), com a sonda apontada para o web local.
  # Grafana em http://localhost:3030 (painel "Escambo"; na demo abre sem login, só para leitura).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: escambo-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    # O prometheus.yml não lê variável de ambiente: o endereço da sonda entra por substituição na subida.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        sed "s|__PROBE_URL__|$$PROBE_URL|g" /etc/prometheus/prometheus.tmpl.yml > /prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$$RETENTION
    environment:
      PROBE_URL: http://web:8080/api/health
      RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.tmpl.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: escambo-blackbox
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: escambo-grafana
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Senha da demo (a mesma das contas de demonstração). Em produção ela é obrigatória no .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Escambo@123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/escambo.json
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      MAIL_FROM: ${MAIL_FROM:-Escambo <nao-responda@escambo.demo>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    entrypoint: ['/bin/sh', '/etc/escambo/grafana-entrypoint.sh']
    volumes:
      - ./deploy/monitoring/grafana/entrypoint.sh:/etc/escambo/grafana-entrypoint.sh:ro
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3030}:3000'
    depends_on:
      - prometheus

volumes:
  api_data:
  prometheus_data:
  grafana_data:
  escambo_db_data:
    name: escambo_db_data
