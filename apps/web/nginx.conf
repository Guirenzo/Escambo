# Escambo Web — nginx servindo o build do Vite (SPA) e fazendo proxy de /api e /socket.io
# para a API. `api` é o nome do serviço no docker-compose (resolvido pelo DNS interno).

upstream escambo_api {
  server api:3333;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão dos assets de texto (JS/CSS/JSON/SVG).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Readiness do container (HEALTHCHECK do Dockerfile).
  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # REST → API. Repassa IP/host/proto para logs, rate limit e X-Request-Id.
  location /api/ {
    proxy_pass http://escambo_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # WebSocket (Socket.IO) → API. Upgrade de conexão e timeout longo (chat fica aberto).
  location /socket.io/ {
    proxy_pass http://escambo_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Assets com hash no nome (Vite): cache longo e imutável.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html (react-router cuida do resto). index nunca é cacheado.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
