# Cabeçalhos de segurança de toda resposta do Escambo Web.
#
# Vive em arquivo separado porque, no nginx, um `add_header` dentro de um `location` descarta
# TODOS os herdados do `server` — então cada location inclui este conjunto por inteiro.
#
# CSP: o app só carrega o que ele mesmo serve. As fontes são locais (@fontsource, empacotadas
# pelo Vite), por isso `font-src 'self'` e nada de fonts.googleapis.com.
#   img-src …  https:  → avatares de perfil podem apontar para qualquer host HTTPS.
#   style-src 'unsafe-inline' → React usa atributo `style` em alguns pontos.
#   connect-src 'self' → REST e WebSocket (Socket.IO) da mesma origem, via proxy do nginx.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; manifest-src 'self'" always;
