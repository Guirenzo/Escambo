<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d5c3a" />
    <meta
      name="description"
      content="Contrate freelancers com o pagamento guardado até aprovar a entrega, ou troque serviço por serviço. Se os valores forem diferentes, o app calcula a torna."
    />
    <title>Escambo: contrate ou troque serviços com pagamento protegido</title>

    <!-- Ícones e instalação (PWA básica). As fontes são locais (@fontsource, empacotadas pelo
         Vite): nenhuma requisição sai para terceiros, e a CSP do nginx pode ser restritiva. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Prévia ao compartilhar o link (WhatsApp, LinkedIn, Slack…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escambo" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Escambo: contrate ou troque serviços com pagamento protegido"
    />
    <meta
      property="og:description"
      content="Busque freelancers perto de você, contrate com o pagamento guardado até aprovar ou troque serviço por serviço: o app calcula a torna."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
