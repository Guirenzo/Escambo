# Escambo — PRODUÇÃO numa VPS: imagens publicadas pelo CI (GHCR) + Caddy com HTTPS automático.
#
#   cp .env.prod.example .env  →  preencha DOMAIN, senhas, JWT_SECRET, ADMIN_EMAILS, SMTP_*
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d        # db → migrate → api → web → caddy
#   curl -s https://SEU_DOMINIO/api/health                 # {"status":"ok","db":"up","version":…,"commit":…}
#
# Diferenças em relação ao docker-compose.yml (demo/dev):
#   - sem build: imagens do registro, fixadas por IMAGE_TAG (latest, sha curto ou versão) → rollback = trocar a tag;
#   - banco e API NÃO publicam porta no host: só o Caddy escuta (80/443) e fala com o web (nginx) pela rede interna;
#   - segredos obrigatórios (`${VAR:?}`): o compose se recusa a subir com senha padrão;
#   - gateway simulado desligado, e-mail via SMTP, TRUST_PROXY=2 (Caddy → nginx → API);
#   - schema, migrations e seed de referência entram pelo job `migrate` (a API só sobe depois dele).
# Guia completo (VPS, DNS, atualização, rollback, backup): DEPLOY.md

name: escambo

x-api-image: &api-image ${API_IMAGE:-ghcr.io/guirenzo/escambo-api}:${IMAGE_TAG:-latest}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-escambo}
      MYSQL_USER: ${DB_USER:-escambo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Aplica baseline + migrations pendentes e, no primeiro boot, o seed de referência (catálogo).
  # A API só sobe depois que este job termina com sucesso — nunca serve com schema defasado.
  migrate:
    image: *api-image
    restart: 'no'
    command: ['node', 'dist/scripts/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-escambo}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_NAME: ${DB_NAME:-escambo}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (32+ caracteres aleatórios)}
      # Caddy → nginx (web) → API: dois saltos confiáveis no X-Forwarded-For, para que rate limit
      # e logs usem o IP real do usuário.
      TRUST_PROXY: '2'
      # O web é servido no mesmo domínio (o nginx faz proxy de /api): CORS só para a própria origem.
      CORS_ORIGINS: https://${DOMAIN:?defina DOMAIN no .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?defina ADMIN_EMAILS no .env}
      # Não existe gateway real ainda (ADR 15): o simulador fica DESLIGADO por padrão.
      PAYMENTS_SIMULATE: ${PAYMENTS_SIMULATE:-false}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      DATA_DIR: /repo/apps/api/data
      EXPORT_TTL_DAYS: ${EXPORT_TTL_DAYS:-7}
      # Anexos do chat (imagem, PDF, ZIP) no mesmo volume; limite por arquivo em MB (o nginx aceita até 25).
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      APP_URL: https://${DOMAIN}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM no .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Avisos push no navegador (ADR 52): webpush exige as duas chaves VAPID.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-simulated}
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:nao-responda@${DOMAIN}}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
      ATTACHMENT_PURGE_HOUR: ${ATTACHMENT_PURGE_HOUR:-4}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      # Observabilidade (ADR 59): /metrics na porta 9464, só na rede interna (o Prometheus lê);
      # erros no Sentry quando SENTRY_DSN tem valor.
      METRICS_PORT: 9464
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

  api:
    image: *api-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api-env
    volumes:
      - api_data:/repo/apps/api/data
    # Sem `ports`: só o web (nginx) fala com a API, pela rede interna do compose.

  web:
    image: ${WEB_IMAGE:-ghcr.io/guirenzo/escambo-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Sem `ports`: o Caddy é a única porta de entrada.

  # Borda: HTTPS automático (Let's Encrypt), HTTP → HTTPS, HTTP/3, HSTS. Config em deploy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env (avisos do Let's Encrypt)}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Monitoramento (ADR 59), perfil opcional: COMPOSE_PROFILES=monitoring no .env ---
  # O Prometheus lê o /metrics da API e a sonda externa; o Grafana mostra o painel "Escambo", avalia os
  # alertas e os manda por e-mail (pelo SMTP do sistema), e só escuta no 127.0.0.1 da VPS
  # (acesso por túnel: ssh -L 3000:127.0.0.1:3000 usuario@vps).
  # Os arquivos de deploy/monitoring chegam pelo workflow Deploy. Bind sem `create_host_path`: se
  # faltarem, a subida para com erro claro em vez de o Docker criar pastas vazias no lugar deles.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    # O prometheus.yml não lê variável de ambiente: o endereço da sonda entra por substituição na subida.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        sed "s|__PROBE_URL__|$$PROBE_URL|g" /etc/prometheus/prometheus.tmpl.yml > /prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$$RETENTION
    environment:
      PROBE_URL: https://${DOMAIN}/api/health
      RETENTION: ${PROMETHEUS_RETENTION:-45d}
    volumes:
      - type: bind
        source: ./deploy/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.tmpl.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    depends_on:
      - api

  # Sonda de fora para dentro: GET https://DOMAIN/api/health pelo Caddy, como um usuário (uptime, RNF-007).
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./deploy/monitoring/blackbox.yml
        target: /etc/blackbox_exporter/config.yml
        read_only: true
        bind:
          create_host_path: false

  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Sem senha o Grafana não sobe (grafana/entrypoint.sh). Um `:?` aqui barraria também quem não
      # usa o perfil.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      # Alertas por e-mail: para ALERT_EMAIL_TO (padrão: o ACME_EMAIL), pelo SMTP dos avisos do sistema.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${ACME_EMAIL:-}}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    entrypoint: ['/bin/sh', '/etc/escambo/grafana-entrypoint.sh']
    volumes:
      - type: bind
        source: ./deploy/monitoring/grafana/entrypoint.sh
        target: /etc/escambo/grafana-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    depends_on:
      - prometheus

volumes:
  # Com o projeto `escambo`, vira `escambo_db_data` — o mesmo volume do docker-compose.yml,
  # então uma instância da demo pode ser promovida sem perder dados.
  db_data:
  api_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
