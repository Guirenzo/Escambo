# SonarCloud (ADR 59). A análise roda no CI (job `sonar`) quando o segredo SONAR_TOKEN existe.
# Organização e chave: as que o SonarCloud cria ao importar Guirenzo/Escambo (confira em
# Administration → Update key; troque aqui se forem outras).
sonar.organization=guirenzo
sonar.projectKey=Guirenzo_Escambo
sonar.projectName=Escambo

sonar.sources=apps/api/src,apps/web/src,packages/types/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,apps/web/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,apps/api/test/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.d.ts
sonar.sourceEncoding=UTF-8

# Cobertura: a do backend (unitários + integração, unidos por scripts/coverage-merge.mjs), que é a
# meta de 75%. O web e os tipos são analisados, mas não entram nesse número: a meta do web (25%) é
# conferida pelo Vitest no CI, e somar as duas daria uma média que não é a meta de nenhuma.
sonar.javascript.lcov.reportPaths=coverage/sonar.lcov.info
# scripts/ é ferramenta de CI e de operação (audit, cobertura, seed), não código do produto.
sonar.coverage.exclusions=apps/web/**,packages/**,apps/api/test/**,scripts/**

# Triagem (docs/triagem-sonar.md): o que procede foi corrigido no código; o que não procede fica aqui, regra a
# regra, com o motivo. Nada de "Aceitar" no painel: a decisão fica versionada e passa por PR.
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,t11,t12,t13,t14,t15,t16,t17,t18,t19
# t1-t5: senha padrão do MySQL descartável dos testes (contêiner do CI e docker-compose de dev), sobrescrita por
# TEST_DB_PASSWORD/CARGA_DB_PASSWORD; e a senha das contas fictícias da demo, publicada no README de propósito.
sonar.issue.ignore.multicriteria.t1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.t1.resourceKey=apps/api/test/**/*
sonar.issue.ignore.multicriteria.t2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.t2.resourceKey=apps/api/vitest.integration.config.ts
sonar.issue.ignore.multicriteria.t3.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.t3.resourceKey=apps/web/e2e/**/*
sonar.issue.ignore.multicriteria.t4.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.t4.resourceKey=scripts/carga/ambiente.mjs
sonar.issue.ignore.multicriteria.t5.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.t5.resourceKey=scripts/demo-seed.mjs
# t6-t8: migrations já aplicadas não mudam (o migrate confere o checksum). O UPDATE sem WHERE é o backfill de
# todas as linhas (0003) e a limpeza LGPD da coluna inteira (0025), de propósito. O "= ''" da 0045 é MySQL, em
# que '' não é NULL: a regra é do dialeto Oracle (PL/SQL).
sonar.issue.ignore.multicriteria.t6.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.t6.resourceKey=apps/api/db/migrations/0003_troca_torna.sql
sonar.issue.ignore.multicriteria.t7.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.t7.resourceKey=apps/api/db/migrations/0025_push_sem_navegador.sql
sonar.issue.ignore.multicriteria.t8.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.t8.resourceKey=apps/api/db/migrations/0045_missoes_periodo.sql
# t9-t10: demo-seed.mjs é ferramenta do operador: API_URL vem dele, e o script só fala com a API que ele mandou
# popular.
sonar.issue.ignore.multicriteria.t9.ruleKey=jssecurity:S7044
sonar.issue.ignore.multicriteria.t9.resourceKey=scripts/demo-seed.mjs
sonar.issue.ignore.multicriteria.t10.ruleKey=jssecurity:S8476
sonar.issue.ignore.multicriteria.t10.resourceKey=scripts/demo-seed.mjs
# t11: o deploy só faz checkout de commit de push na main deste repositório (condição do job), nunca de fork.
sonar.issue.ignore.multicriteria.t11.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.t11.resourceKey=.github/workflows/deploy.yml
# t12: a pasta de saída do wiki-build é conferida como nome simples .wiki-* antes de virar caminho.
sonar.issue.ignore.multicriteria.t12.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.t12.resourceKey=scripts/wiki-build.mjs
# t13-t14: tabIndex de propósito: o recorte do avatar é operado pelo teclado (setas e +/-), e a tabela rolável
# precisa de foco para rolar sem mouse (axe scrollable-region-focusable, WCAG 2.1.1).
sonar.issue.ignore.multicriteria.t13.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.t13.resourceKey=apps/web/src/components/AvatarCropper.tsx
sonar.issue.ignore.multicriteria.t14.ruleKey=typescript:S6845
sonar.issue.ignore.multicriteria.t14.resourceKey=apps/web/src/components/ui/index.tsx
# t15: as estrelas são rádios nativos, o foco fica neles; o grupo só limpa a prévia no mouseleave.
sonar.issue.ignore.multicriteria.t15.ruleKey=typescript:S6852
sonar.issue.ignore.multicriteria.t15.resourceKey=apps/web/src/components/Stars.tsx
# t16-t18: o rótulo tem texto, três níveis abaixo (span > strong > texto), e a regra só olha dois; os testes
# conferem o nome acessível dos rádios.
sonar.issue.ignore.multicriteria.t16.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.t16.resourceKey=apps/web/src/features/profile/EmailPreferencesCard.tsx
sonar.issue.ignore.multicriteria.t17.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.t17.resourceKey=apps/web/src/features/services/ContratarModal.tsx
sonar.issue.ignore.multicriteria.t18.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.t18.resourceKey=apps/web/src/features/services/SavedSearches.tsx
# t19: o nome da conta Google vem da nossa API e só preenche a sugestão do campo de nome do perfil (o React escapa;
# a API valida ao salvar). Mesmo assim sai sem caracteres de controle e com no máximo 150 caracteres.
sonar.issue.ignore.multicriteria.t19.ruleKey=tssecurity:S8475
sonar.issue.ignore.multicriteria.t19.resourceKey=apps/web/src/lib/google.ts
