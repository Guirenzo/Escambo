# SonarCloud (ADR 59). A análise roda no CI (job `sonar`) quando o segredo SONAR_TOKEN existe.
# Organização e chave: as que o SonarCloud cria ao importar Guirenzo/Escambo (confira em
# Administration → Update key; troque aqui se forem outras).
sonar.organization=guirenzo
sonar.projectKey=Guirenzo_Escambo
sonar.projectName=Escambo

sonar.sources=apps/api/src,apps/web/src,packages/types/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,apps/web/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,apps/api/test/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.d.ts
sonar.sourceEncoding=UTF-8

# Cobertura: a do backend (unitários + integração, unidos por scripts/coverage-merge.mjs), que é a
# meta de 75%. O web e os tipos são analisados, mas não entram nesse número: a meta do web (25%) é
# conferida pelo Vitest no CI, e somar as duas daria uma média que não é a meta de nenhuma.
sonar.javascript.lcov.reportPaths=coverage/sonar.lcov.info
sonar.coverage.exclusions=apps/web/**,packages/**,apps/api/test/**
