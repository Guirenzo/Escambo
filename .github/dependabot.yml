# Atualizações de dependência (RFC, seção de segurança): toda semana, um PR por grupo para o npm (produção e
# desenvolvimento) e um para as actions. Só versões menores e correções: versão maior muda API e é atualizada
# de propósito, num bloco próprio. Alertas de segurança continuam chegando para qualquer versão.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        update-types: [minor, patch]
