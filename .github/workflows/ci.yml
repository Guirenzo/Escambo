# CI do Escambo: roda em todo push nas branches de trabalho e em todo PR para a main.
# Jobs e o que cada um espera (needs):
#   build-and-test, integration, segredos e backup começam juntos, sem esperar ninguém;
#   e2e espera o build-and-test; coverage espera build-and-test e integration;
#   sonar espera o coverage; publish (só push na main) espera todos menos o sonar.
# Os 6 checks obrigatórios para entrar na main: Lint · Typecheck · Test · Build, Integração, E2E,
# Cobertura, Segredos e Backup. O SonarCloud só informa: falhar não segura imagem nem deploy.
# Job vermelho: o publish não roda, o CI termina em failure e o deploy não acontece.
# CI verde num push na main: o publish manda as imagens ao GHCR e o Deploy (deploy.yml) põe no ar.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  # build-and-test: o check principal. Instala, audita dependências, lint, Prettier, typecheck,
  # unitários com cobertura (API e Web), build e confere o compose de produção. Não espera
  # ninguém; se falhar, e2e, coverage e publish não rodam.
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci instala exatamente o package-lock; --ignore-scripts não roda script de pacote.
      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # ADR 74: o npm audit reprova vulnerabilidade alta ou crítica, menos as exceções com motivo e
      # data-limite em scripts/audit-excecoes.json, que só valem fora das dependências de produção.
      - name: Dependências sem vulnerabilidade alta (npm audit)
        run: npm run audit:deps

      - name: Lint (ESLint)
        run: npm run lint

      # RNF-032: código fora do padrão do Prettier reprova o CI. Markdown e arquivos gerados ficam
      # de fora (.prettierignore). Para corrigir, rode `npm run format` e confira o diff.
      - name: Formatação (Prettier)
        run: npx prettier --check .

      - name: Typecheck (tsc)
        run: npm run typecheck

      # Unitários com cobertura: API e Web exigem 90% de linhas/instruções/funções e 85% de branches.
      # A união API + integração também é conferida no job `coverage`, com a meta adicional de 75%.
      - name: Testes unitários + cobertura (API)
        run: npm run -w @escambo/api test:cov

      - name: Testes unitários + cobertura (Web)
        run: npm run -w @escambo/web test:cov

      # Guarda a cobertura como artefato: o job coverage baixa e junta com a da integração.
      - name: Relatórios de cobertura (unitários)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            apps/api/coverage/unit
            apps/web/coverage
          retention-days: 7

      - name: Build (API + Web)
        run: npm run build

      # Confere que o docker-compose.prod.yml é válido, com valores falsos só neste passo.
      - name: Compose de produção válido (interpolação + YAML)
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          DOMAIN: escambo.example
          ACME_EMAIL: ops@escambo.example
          DB_PASSWORD: x
          DB_ROOT_PASSWORD: x
          JWT_SECRET: segredo-de-validacao-do-compose-com-32-caracteres
          ADMIN_EMAILS: admin@escambo.example
          MAIL_FROM: Escambo <nao-responda@escambo.example>

  # integration: os testes de integração (Supertest) contra um MySQL 8 de verdade, que o
  # GitHub sobe como serviço. Não espera ninguém; a cobertura dele vai para o job coverage.
  integration:
    name: Integração · Supertest + MySQL
    runs-on: ubuntu-latest

    # services: contêineres que o GitHub sobe ao lado do job; o MySQL fica em 127.0.0.1:3306.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: escambo_root
        ports:
          - 3306:3306
        # `mysqladmin ping` sai com 0 mesmo com acesso negado: só confere que o servidor responde,
        # então o comando não precisa da senha.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Testes de integração + cobertura
        run: npm run -w @escambo/api test:int:cov
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: escambo_root
          TEST_DB_NAME: escambo_test

      - name: Relatório de cobertura (integração)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/integration
          retention-days: 7

  # RNF-020: nenhum segredo no repositório. Confere que o .gitignore cobre os .env, chaves, backups
  # e dados da API, que nada disso está versionado, e roda o gitleaks em todos os commits (o
  # histórico inteiro: segredo apagado depois continua vazado). Exceções só por valor, em .gitleaks.toml.
  segredos:
    name: Segredos · .gitignore e histórico (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico inteiro)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ShellCheck do script
        run: shellcheck scripts/segredos.sh

      - name: Varredura
        run: bash scripts/segredos.sh

  # RNF-009: o backup volta. Num MySQL descartável, aplica baseline + migrations com o runner da API,
  # insere dados, faz o backup como o serviço `backup` de produção faz (deploy/backup/agendador.sh),
  # apaga o banco, restaura com scripts/restore-db.sh e confere que linhas, CHECKSUM, estrutura,
  # triggers (com DEFINER) e schema_migrations voltaram iguais e que os triggers ainda barram UPDATE e
  # DELETE no extrato. Também confere a retenção, o last-backup.json, a métrica e o pacote dos arquivos.
  backup:
    name: Backup · restauração testada (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: escambo_root
        ports:
          - 3306:3306
        # `mysqladmin ping` sai com 0 mesmo com acesso negado: só confere que o servidor responde,
        # então o comando não precisa da senha.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck dos scripts de backup
        run: shellcheck -x deploy/backup/*.sh scripts/backup-db.sh scripts/backup-uploads.sh scripts/restore-db.sh scripts/test-backup-restore.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Backup → apaga o banco → restaura → compara
        run: bash scripts/test-backup-restore.sh
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_ROOT_PASSWORD: escambo_root

  # Meta do backend (75%, Playbook de Web Apps) sobre a união unitários + integração (ADR 59).
  # Espera build-and-test e integration (needs): sem os dois relatórios não há o que unir.
  coverage:
    name: Cobertura · meta do backend
    runs-on: ubuntu-latest
    needs: [build-and-test, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # O upload guarda a partir do ancestral comum dos caminhos: `coverage-unit` a partir de apps/,
      # `coverage-integration` a partir da própria pasta.
      - name: Baixar a cobertura dos unitários
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: apps

      - name: Baixar a cobertura da integração
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/integration

      - name: União e meta (75%)
        run: npm run coverage:merge

      - name: Relatório unido
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            coverage/sonar.lcov.info
            apps/api/coverage/merged
          retention-days: 30

  # Análise estática e de segurança no SonarCloud (ADR 59), com a cobertura do backend. Liga sozinho
  # quando o segredo SONAR_TOKEN existe (Settings → Secrets and variables → Actions); sem ele, só avisa
  # (ou falha, com a variável DELIVERY_ENFORCED=true). É informativo: o resultado fica no painel do
  # projeto e no PR, e uma falha do scan (serviço fora, chave errada) não segura imagem nem deploy.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [coverage]
    # continue-on-error: se este job falhar, o CI continua verde (o Sonar só informa).
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ENFORCED: ${{ vars.DELIVERY_ENFORCED }}

    steps:
      - name: SonarCloud configurado?
        if: env.SONAR_TOKEN == ''
        run: |
          if [ "$ENFORCED" = "true" ]; then
            echo "::error::Falta o segredo SONAR_TOKEN (ver docs/wiki/Qualidade.md)."
            exit 1
          fi
          echo "::warning::SonarCloud desligado: falta o segredo SONAR_TOKEN (ver docs/wiki/Qualidade.md)."

      - name: Checkout (histórico completo, para o blame e o código novo)
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar a cobertura
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-merged
          path: .

      - name: Análise
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  # e2e: testes ponta a ponta com Playwright (desktop, mobile e acessibilidade) contra a API e o
  # web de verdade, com MySQL. Espera o build-and-test.
  e2e:
    name: E2E · Playwright (Web + API + MySQL)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: escambo_root
          MYSQL_DATABASE: escambo
        ports:
          - 3306:3306
        # `mysqladmin ping` sai com 0 mesmo com acesso negado: só confere que o servidor responde,
        # então o comando não precisa da senha.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Variáveis só de teste para a API do E2E (nenhuma é de produção).
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: escambo_root
      DB_NAME: escambo
      JWT_SECRET: segredo-de-e2e-no-ci-com-mais-de-32-caracteres
      LOG_LEVEL: warn
      # os testes criam vários usuários por execução; sem isso o rate limit de login derruba a suíte
      LOGIN_RATE_LIMIT_MAX: '1000'
      RATE_LIMIT_MAX: '10000'
      # cada execução sobe uns 36 anexos (desktop + mobile, com os specs de acessibilidade); o teto
      # padrão é 60 por hora por IP, e uma repetição de teste passaria dele
      UPLOAD_RATE_LIMIT_MAX: '1000'
      ADMIN_EMAILS: '@admin.escambo.test'
      # Chave de TESTE da cifragem de campo: sem ela a verificação em duas etapas fica indisponível
      # (ADR 66) e o spec dois-fatores não roda. São os 32 bytes de "chave-de-teste-do-escambo-2fa-32".
      FIELD_ENCRYPTION_KEY: Y2hhdmUtZGUtdGVzdGUtZG8tZXNjYW1iby0yZmEtMzI=
      # Login com Google (RF-002) contra o Google FALSO dos testes (apps/web/e2e/google-falso.mjs, só em
      # 127.0.0.1): cliente e segredo de TESTE, sem uso fora do CI. Sem eles, o spec do Google só
      # confere o desligado.
      GOOGLE_CLIENT_ID: cliente-de-teste.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: segredo-de-teste-do-google-com-32-caracteres
      GOOGLE_TEST_IDP_URL: http://127.0.0.1:4590

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Build (API + Web)
        run: npm run build

      - name: Chromium do Playwright
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Schema (migrations) + seed de referência
        run: |
          node apps/api/dist/scripts/migrate.js
          MYSQL_PWD="$DB_PASSWORD" mysql -h127.0.0.1 -u"$DB_USER" escambo < apps/api/db/seed.sql

      - name: Sobe API e Web (build servido pelo Vite preview) em background
        run: |
          export NODE_ENV=production
          (cd apps/web && nohup node e2e/google-falso.mjs --port 4590 > /tmp/google.log 2>&1 &)
          (cd apps/api && nohup node dist/server.js > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup npx vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3333/api/health >/dev/null && curl -fsS http://localhost:5173 >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3333/api/health

      - name: Testes ponta a ponta (desktop + mobile + acessibilidade)
        run: npm run -w apps/web e2e
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Logs da API/Web (só em falha)
        if: failure()
        run: tail -n 120 /tmp/api.log /tmp/web.log /tmp/google.log 2>/dev/null || true

      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Só em main, com testes, E2E, cobertura, restauração do backup e varredura de segredos verdes:
  # constrói as imagens de produção e publica no GHCR.
  # Tags: latest · sha curto · versão do package.json. Quem as põe no ar é o workflow Deploy (deploy.yml).
  publish:
    name: Publicar imagens (GHCR)
    runs-on: ubuntu-latest
    # if: só em push na main (nunca em PR). needs: os seis jobs obrigatórios, sem o sonar.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, integration, e2e, coverage, backup, segredos]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nomes e tags (o GHCR exige dono em minúsculas)
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/escambo-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/escambo-web" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Imagem da API com três tags; o rótulo revision guarda o commit, que o Deploy lê depois.
      - name: API → GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.api }}:latest
            ${{ steps.img.outputs.api }}:${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.api }}:${{ steps.img.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web → GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.web }}:latest
            ${{ steps.img.outputs.web }}:${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.web }}:${{ steps.img.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas"
            echo "- \`${{ steps.img.outputs.api }}\` → latest · ${{ steps.img.outputs.sha }} · ${{ steps.img.outputs.version }}"
            echo "- \`${{ steps.img.outputs.web }}\` → latest · ${{ steps.img.outputs.sha }} · ${{ steps.img.outputs.version }}"
            echo
            echo "O workflow **Deploy** põe este commit no ar na VPS quando o CI termina verde (DEPLOY.md, seção 3)."
          } >> "$GITHUB_STEP_SUMMARY"
