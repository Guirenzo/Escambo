name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Dependências sem vulnerabilidade alta (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      # Unitários com cobertura (ADR 59): a do web tem meta própria (25%, vite.config.ts); a da API
      # só é conferida unida à da integração, no job `coverage`.
      - name: Testes unitários + cobertura (API)
        run: npm run -w @escambo/api test:cov

      - name: Testes unitários + cobertura (Web, meta 25%)
        run: npm run -w @escambo/web test:cov

      - name: Relatórios de cobertura (unitários)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            apps/api/coverage/unit
            apps/web/coverage
          retention-days: 7

      - name: Build (API + Web)
        run: npm run build

      - name: Compose de produção válido (interpolação + YAML)
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          DOMAIN: escambo.example
          ACME_EMAIL: ops@escambo.example
          DB_PASSWORD: x
          DB_ROOT_PASSWORD: x
          JWT_SECRET: segredo-de-validacao-do-compose-com-32-caracteres
          ADMIN_EMAILS: admin@escambo.example
          MAIL_FROM: Escambo <nao-responda@escambo.example>

  integration:
    name: Integração · Supertest + MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: escambo_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pescambo_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes de integração + cobertura
        run: npm run -w @escambo/api test:int:cov
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: escambo_root
          TEST_DB_NAME: escambo_test

      - name: Relatório de cobertura (integração)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/integration
          retention-days: 7

  # Meta do backend (75%, Playbook de Web Apps) sobre a união unitários + integração (ADR 59).
  coverage:
    name: Cobertura · meta do backend
    runs-on: ubuntu-latest
    needs: [build-and-test, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O upload guarda a partir do ancestral comum dos caminhos: `coverage-unit` a partir de apps/,
      # `coverage-integration` a partir da própria pasta.
      - name: Baixar a cobertura dos unitários
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: apps

      - name: Baixar a cobertura da integração
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/integration

      - name: União e meta (75%)
        run: npm run coverage:merge

      - name: Relatório unido
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: |
            coverage/sonar.lcov.info
            apps/api/coverage/merged
          retention-days: 30

  # Análise estática e de segurança no SonarCloud (ADR 59), com a cobertura do backend. Liga sozinho
  # quando o segredo SONAR_TOKEN existe (Settings → Secrets and variables → Actions); sem ele, só avisa
  # (ou falha, com a variável DELIVERY_ENFORCED=true). É informativo: o resultado fica no painel do
  # projeto e no PR, e uma falha do scan (serviço fora, chave errada) não segura imagem nem deploy.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [coverage]
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ENFORCED: ${{ vars.DELIVERY_ENFORCED }}

    steps:
      - name: SonarCloud configurado?
        if: env.SONAR_TOKEN == ''
        run: |
          if [ "$ENFORCED" = "true" ]; then
            echo "::error::Falta o segredo SONAR_TOKEN (ver docs/wiki/Qualidade.md)."
            exit 1
          fi
          echo "::warning::SonarCloud desligado: falta o segredo SONAR_TOKEN (ver docs/wiki/Qualidade.md)."

      - name: Checkout (histórico completo, para o blame e o código novo)
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar a cobertura
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-merged
          path: .

      - name: Análise
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  e2e:
    name: E2E · Playwright (Web + API + MySQL)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: escambo_root
          MYSQL_DATABASE: escambo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pescambo_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: escambo_root
      DB_NAME: escambo
      JWT_SECRET: segredo-de-e2e-no-ci-com-mais-de-32-caracteres
      LOG_LEVEL: warn
      # os testes criam vários usuários por execução; sem isso o rate limit de login derruba a suíte
      LOGIN_RATE_LIMIT_MAX: '1000'
      RATE_LIMIT_MAX: '10000'
      ADMIN_EMAILS: '@admin.escambo.test'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (API + Web)
        run: npm run build

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Schema (migrations) + seed de referência
        run: |
          node apps/api/dist/scripts/migrate.js
          mysql -h127.0.0.1 -uroot -pescambo_root escambo < apps/api/db/seed.sql

      - name: Sobe API e Web (build servido pelo Vite preview) em background
        run: |
          export NODE_ENV=production
          (cd apps/api && nohup node dist/server.js > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup npx vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3333/api/health >/dev/null && curl -fsS http://localhost:5173 >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3333/api/health

      - name: Testes ponta a ponta (desktop + mobile + acessibilidade)
        run: npm run -w apps/web e2e
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Logs da API/Web (só em falha)
        if: failure()
        run: tail -n 120 /tmp/api.log /tmp/web.log 2>/dev/null || true

      - name: Relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Só em main, com testes, E2E e cobertura verdes: constrói as imagens de produção e publica no GHCR.
  # Tags: latest · sha curto · versão do package.json. Quem as põe no ar é o workflow Deploy (deploy.yml).
  publish:
    name: Publicar imagens (GHCR)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, integration, e2e, coverage]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nomes e tags (o GHCR exige dono em minúsculas)
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/escambo-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/escambo-web" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API → GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.api }}:latest
            ${{ steps.img.outputs.api }}:${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.api }}:${{ steps.img.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web → GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.web }}:latest
            ${{ steps.img.outputs.web }}:${{ steps.img.outputs.sha }}
            ${{ steps.img.outputs.web }}:${{ steps.img.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Resumo
        run: |
          {
            echo "### Imagens publicadas"
            echo "- \`${{ steps.img.outputs.api }}\` → latest · ${{ steps.img.outputs.sha }} · ${{ steps.img.outputs.version }}"
            echo "- \`${{ steps.img.outputs.web }}\` → latest · ${{ steps.img.outputs.sha }} · ${{ steps.img.outputs.version }}"
            echo
            echo "O workflow **Deploy** põe este commit no ar na VPS quando o CI termina verde (DEPLOY.md, seção 3)."
          } >> "$GITHUB_STEP_SUMMARY"
