<!doctype html>
<!--
  Escambo — página de "fora do ar" (RNF-010). O Caddy serve esta página quando não alcança o web
  (container parado, reiniciando ou sem responder): ver handle_errors em deploy/Caddyfile.
  Não depende do app nem da API, então tudo fica aqui dentro: sem script, fonte ou imagem externa.
  O meta refresh tenta de novo a cada 30 s; quando o site volta, o recarregamento já abre o app.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="30" />
    <meta name="robots" content="noindex" />
    <title>Escambo — fora do ar</title>
    <style>
      :root {
        --bg: #f5f6f7;
        --surface: #ffffff;
        --text: #0f1a14;
        --muted: #566860;
        --border: #e4e9e6;
        --green: #0d5c3a;
        --green-soft: #e7f3ec;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1412;
          --surface: #161d1a;
          --text: #e8efeb;
          --muted: #a3b3ab;
          --border: #26302c;
          --green: #5fc795;
          --green-soft: #17271f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.55 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 460px;
        width: 100%;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      .marca {
        margin: 0 0 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--green);
      }
      .icone {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--green-soft);
        color: var(--green);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--green);
        color: var(--surface);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main role="alert">
      <p class="marca">Escambo</p>
      <div class="icone" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          />
        </svg>
      </div>
      <h1>O Escambo está fora do ar</h1>
      <p>
        Já estamos cuidando disso. Suas contratações, saldo e mensagens continuam guardados; nada se
        perde enquanto o site está parado.
      </p>
      <p>
        Esta página tenta de novo sozinha a cada 30 segundos e abre o site assim que ele voltar.
      </p>
      <a href="/">Tentar agora</a>
    </main>
  </body>
</html>
